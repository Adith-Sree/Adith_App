# render.yaml
# Render Blueprint — deploys FastAPI backend + managed PostgreSQL in one click.
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ─────────────────────────────────────────────────────────────────
  # 1. FastAPI Backend Web Service
  # ─────────────────────────────────────────────────────────────────
  - type: web
    name: deepwork-backend
    runtime: python
    region: singapore    # Closest to India — change to oregon/frankfurt if needed
    plan: free           # Upgrade to starter ($7/mo) when you need persistent disk
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: deepwork-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false        # You will paste this manually in the Render dashboard

# ─────────────────────────────────────────────────────────────────
# 2. Managed PostgreSQL Database
# ─────────────────────────────────────────────────────────────────
databases:
  - name: deepwork-db
    plan: free             # 1 GB storage, 1 month auto-expire on free tier
    region: singapore
    databaseName: deepwork
    user: postgres
