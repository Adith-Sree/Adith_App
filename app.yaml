name: deepwork-backend
region: sgp
services:
  - name: backend
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    http_port: 8000
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-1gb
    routes:
      - path: /
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${deepwork-db.DATABASE_PRIVATE_URL}
      - key: GEMINI_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: ""

databases:
  - name: deepwork-db
    engine: PG
    version: "15"
    production: false
